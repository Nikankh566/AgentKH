<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #e8e8ec;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ================= ISLAND ================= */
  #stage {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none;
  }
  #island {
    pointer-events: auto;
    margin-top: 6px;
    height: 62px; min-width: 210px;
    background: #0b0b0d;
    border: 1px solid #2a2a32;
    border-radius: 34px;
    display: flex; align-items: center;
    padding: 0 22px 0 10px; gap: 10px;
    cursor: pointer;
    box-shadow: 0 4px 24px rgba(0,0,0,.55);
    transition: transform .18s ease, border-color .25s, box-shadow .25s;
    animation: slideDown .55s cubic-bezier(.2,1.4,.4,1);
  }
  #island:hover { transform: scale(1.03); }
  #island.approval {
    border-color: #ff9f2e;
    animation: approvalPulse 1.1s ease-in-out infinite, slideDown .55s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes slideDown {
    from { transform: translateY(-80px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  @keyframes approvalPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,159,46,.55), 0 4px 24px rgba(0,0,0,.55); }
    50%      { box-shadow: 0 0 22px 4px rgba(255,159,46,.45), 0 4px 24px rgba(0,0,0,.55); }
  }
  #island-label { font-size: 14px; font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
  #island-label .dim { color: #8a8fa3; font-weight: 400; }

  /* ================= MOCHI (SVG) ================= */
  .mochi { width: 52px; height: 46px; overflow: visible; flex-shrink: 0; }
  .mochi .body-group { animation: breathe 3.2s ease-in-out infinite; transform-origin: 50px 60px; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025, .985); } }
  .mochi .eyes-normal { animation: blink 4.6s infinite; transform-origin: 50px 38px; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.08); } }
  .mochi.jump .body-group { animation: jumpy .55s cubic-bezier(.3,1.6,.5,1); }
  @keyframes jumpy { 0% { transform: translateY(0); } 40% { transform: translateY(-13px); } 100% { transform: translateY(0); } }
  .mochi.shake .body-group { animation: shaky .4s; }
  @keyframes shaky { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-4deg); } 75% { transform: translateX(5px) rotate(4deg); } }
  .mochi .zzz { opacity: 0; font-size: 13px; fill: #8a8fa3; font-weight: bold; }
  .mochi.sleeping .zzz { opacity: 1; animation: zfloat 2.4s ease-in-out infinite; }
  @keyframes zfloat { 0% { transform: translate(0,0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(10px,-16px); opacity: 0; } }
  .eye-set { display: none; }
  .eye-set.on { display: inline; }

  /* floating hearts */
  .heart {
    position: absolute; font-size: 15px;
    animation: floatUp 2.2s ease-out forwards;
    pointer-events: none;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-64px) scale(1.15); opacity: 0; }
  }

  /* ================= PANEL ================= */
  #panel {
    pointer-events: auto;
    width: 660px; max-width: 94vw;
    height: 0; opacity: 0;
    margin-top: 10px;
    background: rgba(18,18,22,.96);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid #2c2c34;
    border-radius: 18px;
    box-shadow: 0 18px 60px rgba(0,0,0,.6);
    overflow: hidden;
    transition: height .32s cubic-bezier(.3,1.25,.4,1), opacity .22s;
    display: flex; flex-direction: column;
  }
  #panel.open { height: 560px; opacity: 1; }

  #tabs {
    display: flex; align-items: center; gap: 4px;
    padding: 10px 14px;
    border-bottom: 1px solid #26262e;
  }
  .tab {
    background: none; border: none; color: #8a8fa3;
    font-size: 20px; padding: 8px 14px; border-radius: 10px;
    cursor: pointer; transition: all .15s;
  }
  .tab:hover { background: #23232b; color: #e8e8ec; }
  .tab.active { color: #fff; background: #26262e; }
  #tabs .spacer { flex: 1; }
  .icon-btn {
    background: none; border: none; color: #8a8fa3;
    font-size: 17px; padding: 8px 10px; border-radius: 10px; cursor: pointer;
  }
  .icon-btn:hover { background: #23232b; color: #fff; }

  .view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .view.active { display: flex; }

  /* chat */
  #chat-log { flex: 1; overflow-y: auto; padding: 16px 18px; }
  #chat-log::-webkit-scrollbar { width: 8px; }
  #chat-log::-webkit-scrollbar-thumb { background: #33333d; border-radius: 4px; }
  .msg { margin-bottom: 14px; line-height: 1.55; font-size: 14px; animation: msgIn .25s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } }
  .msg.user { color: #9ecbff; }
  .msg.bot { color: #e8e8ec; }
  .msg.bot b { color: #fff; }
  .msg.bot code {
    font-family: Consolas, monospace; font-size: 13px;
    background: #23232b; color: #ffd479;
    padding: 2px 6px; border-radius: 6px;
  }
  .msg.sys { color: #8a8fa3; text-align: center; font-size: 13px; }
  .msg.err { color: #ff7b7b; text-align: center; font-size: 13px; }
  .msg.act { color: #7ee2a8; font-size: 13px; font-family: Consolas, monospace; }
  .typing { color: #8a8fa3; letter-spacing: 3px; animation: msgIn .25s ease; margin-bottom: 14px; }
  .typing span { animation: tblink 1.2s infinite; display: inline-block; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes tblink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  #model-pill {
    align-self: flex-start; margin: 0 18px 8px;
    background: #1c1c22; border: 1px solid #33333d; color: #cfd2dc;
    font-size: 12.5px; padding: 6px 14px; border-radius: 20px; cursor: pointer;
    transition: all .15s;
  }
  #model-pill:hover { border-color: #7c6cf5; color: #fff; }
  #input-row { display: flex; gap: 10px; padding: 12px 16px 16px; }
  #chat-input {
    flex: 1; background: #1c1c22; border: 1px solid #33333d; color: #fff;
    border-radius: 12px; padding: 12px 14px; font-size: 14px; outline: none;
    font-family: inherit; transition: border-color .15s;
  }
  #chat-input:focus { border-color: #7c6cf5; }
  #send-btn {
    background: #7c6cf5; color: #fff; border: none; border-radius: 12px;
    padding: 0 22px; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  #send-btn:hover { background: #8f7ff7; }

  /* cards */
  .card {
    margin: 12px 18px 0; padding: 14px 16px; border-radius: 14px;
    animation: msgIn .3s ease;
  }
  .card.approval { background: #2b2118; border: 1px solid #ff9f2e; }
  .card.update { background: #14291c; border: 1px solid #3ddc84; }
  .card h4 { font-size: 14px; margin-bottom: 6px; }
  .card.approval h4 { color: #ffb75e; }
  .card.update h4 { color: #3ddc84; }
  .card p { font-size: 13px; color: #b9bdc9; margin-bottom: 4px; }
  .card code {
    display: block; font-family: Consolas, monospace; font-size: 12.5px;
    background: rgba(0,0,0,.35); color: #ffd479;
    padding: 8px 10px; border-radius: 8px; margin: 8px 0;
    white-space: pre-wrap; word-break: break-all;
  }
  .card .row { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    border: none; border-radius: 10px; padding: 9px 18px;
    font-size: 13.5px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .btn.ghost { background: #33333d; color: #e8e8ec; }
  .btn.ghost:hover { background: #3f3f4a; }
  .btn.green { background: #3ddc84; color: #06281a; }
  .btn.green:hover { background: #5ce896; }
  .btn.orange { background: #ff9f2e; color: #2b1a05; }
  .btn.orange:hover { background: #ffb75e; }
  .btn.red { background: transparent; color: #ff7b7b; border: 1px solid #5a2b2b; }
  .btn.red:hover { background: #3a2020; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* settings */
  #settings-log { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #8a8fa3; margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; background: #1c1c22; border: 1px solid #33333d; color: #fff;
    border-radius: 10px; padding: 10px 12px; font-size: 13.5px;
    font-family: inherit; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #7c6cf5; }
  .field textarea { height: 110px; resize: vertical; font-family: Consolas, monospace; font-size: 12.5px; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: #7c6cf5; }
  #ver-row { display: flex; align-items: center; gap: 12px; margin-top: 20px; color: #8a8fa3; font-size: 13px; }
</style>
</head>
<body>
<div id="stage">
  <div id="island" title="Agent KH">
    <svg class="mochi" id="mochi" viewBox="0 0 100 88">
      <ellipse cx="50" cy="80" rx="30" ry="4.5" fill="rgba(0,0,0,.45)"/>
      <g class="body-group">
        <rect x="13" y="10" width="74" height="62" rx="26" fill="#fdfbf6"/>
        <ellipse cx="30" cy="54" rx="6.5" ry="4.5" fill="#f3aebe" opacity=".65"/>
        <ellipse cx="70" cy="54" rx="6.5" ry="4.5" fill="#f3aebe" opacity=".65"/>
        <g id="eyes-track">
          <g class="eye-set on" id="eyes-normal">
            <ellipse class="eyes-normal" cx="39" cy="40" rx="6" ry="8.5" fill="#20222a"/>
            <ellipse class="eyes-normal" cx="61" cy="40" rx="6" ry="8.5" fill="#20222a"/>
            <circle cx="41" cy="37" r="2.1" fill="#fff"/>
            <circle cx="63" cy="37" r="2.1" fill="#fff"/>
          </g>
          <g class="eye-set" id="eyes-happy">
            <path d="M31 42 Q39 32 47 42" stroke="#20222a" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M53 42 Q61 32 69 42" stroke="#20222a" stroke-width="4" fill="none" stroke-linecap="round"/>
          </g>
          <g class="eye-set" id="eyes-sleepy">
            <line x1="32" y1="40" x2="46" y2="40" stroke="#20222a" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="54" y1="40" x2="68" y2="40" stroke="#20222a" stroke-width="3.5" stroke-linecap="round"/>
          </g>
          <g class="eye-set" id="eyes-dizzy">
            <g stroke="#20222a" stroke-width="3.2" stroke-linecap="round">
              <line x1="33" y1="34" x2="45" y2="46"/><line x1="45" y1="34" x2="33" y2="46"/>
              <line x1="55" y1="34" x2="67" y2="46"/><line x1="67" y1="34" x2="55" y2="46"/>
            </g>
          </g>
          <g class="eye-set" id="eyes-annoyed">
            <line x1="31" y1="30" x2="47" y2="36" stroke="#20222a" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="69" y1="30" x2="53" y2="36" stroke="#20222a" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="39" cy="44" r="4.5" fill="#20222a"/>
            <circle cx="61" cy="44" r="4.5" fill="#20222a"/>
          </g>
          <g class="eye-set" id="eyes-error">
            <line x1="32" y1="44" x2="46" y2="36" stroke="#20222a" stroke-width="3.2" stroke-linecap="round"/>
            <line x1="54" y1="44" x2="68" y2="36" stroke="#20222a" stroke-width="3.2" stroke-linecap="round"/>
          </g>
        </g>
        <g class="eye-set" id="badge">
          <circle cx="76" cy="22" r="11" fill="#ff9f2e" stroke="#fff" stroke-width="2"/>
          <text x="76" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">!</text>
        </g>
        <text class="zzz" x="78" y="14">z</text>
      </g>
    </svg>
    <span id="island-label">Agent KH</span>
  </div>

  <div id="panel">
    <div id="tabs">
      <button class="tab active" data-view="chat" title="Chat">💬</button>
      <button class="tab" data-view="activity" title="Activity">📋</button>
      <button class="tab" data-view="settings" title="Settings">⚙️</button>
      <div class="spacer"></div>
      <button class="icon-btn" id="mute-btn" title="Sound">🔊</button>
      <button class="icon-btn" id="close-btn" title="Close">✕</button>
    </div>

    <div class="view active" id="view-chat">
      <div id="chat-log"></div>
      <div id="cards"></div>
      <button id="model-pill" title="Switch model">⚪ …</button>
      <div id="input-row">
        <input id="chat-input" placeholder="Ask anything…  (/new /model /screenshot)" autocomplete="off">
        <button id="send-btn">➤</button>
      </div>
    </div>

    <div class="view" id="view-activity">
      <div id="chat-log-activity" style="flex:1;overflow-y:auto;padding:16px 18px;"></div>
    </div>

    <div class="view" id="view-settings">
      <div id="settings-log">
        <div class="field"><label>Provider</label>
          <select id="s-provider"><option value="gemini">gemini</option><option value="openai">openai</option><option value="custom">custom</option></select></div>
        <div class="field"><label>Gemini API key</label><input id="s-key" type="password" placeholder="AIza…"></div>
        <div class="field"><label>Gemini model</label><input id="s-model" placeholder="gemini-3.5-flash"></div>
        <div class="field"><label>Custom URL / key / model <span style="color:#5a5e6e">(one per line)</span></label>
          <textarea id="s-custom" rows="3" style="height:64px"></textarea></div>
        <div class="field"><label class="check"><input type="checkbox" id="s-auto"> Auto-approve commands <span style="color:#ff7b7b">(careful!)</span></label></div>
        <div class="field"><label>Language</label>
          <select id="s-lang"><option value="en">en</option><option value="fa">fa</option></select></div>
        <div class="field"><label>Personality (soul.md)</label><textarea id="s-soul"></textarea></div>
        <div class="field"><label>MCP servers <span style="color:#5a5e6e">(one per line: name | command args…)</span></label>
          <textarea id="s-mcp" rows="3" style="height:64px"></textarea></div>
        <div class="row" style="display:flex;gap:10px;margin-top:6px;">
          <button class="btn green" id="save-btn" style="background:#7c6cf5;color:#fff;">Save</button>
        </div>
        <div id="ver-row"><span id="ver-text"></span>
          <button class="btn ghost" id="upd-btn" style="font-size:12.5px;padding:7px 14px;">🔄 Check for updates</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* pywebview bridge (mocked when opened in a plain browser) */
const api = (window.pywebview && window.pywebview.api) ? window.pywebview.api : new Proxy({}, {
  get: (t, k) => (...a) => { console.log("[mock api]", k, ...a); return Promise.resolve(null); }
});

const $ = id => document.getElementById(id);
const island = $("island"), panel = $("panel"), mochi = $("mochi");
const chatLog = $("chat-log"), actLog = $("chat-log-activity"), cards = $("cards");
const label = $("island-label");

/* ---------- moods ---------- */
const EYE_SETS = ["eyes-normal","eyes-happy","eyes-sleepy","eyes-dizzy","eyes-annoyed","eyes-error"];
function setEyes(id) {
  EYE_SETS.forEach(e => $(e).classList.remove("on"));
  $(id).classList.add("on");
  $("badge").classList.toggle("on", id === "eyes-normal" && mochi.dataset.mood === "approval");
}
function setMood(m) {
  mochi.dataset.mood = m;
  mochi.classList.toggle("sleeping", m === "sleeping");
  $("badge").classList.toggle("on", m === "approval");
  setEyes({idle:"eyes-normal", thinking:"eyes-normal", working:"eyes-normal",
           searching:"eyes-normal", approval:"eyes-normal", happy:"eyes-happy",
           sleeping:"eyes-sleepy", dizzy:"eyes-dizzy", annoyed:"eyes-annoyed",
           error:"eyes-error"}[m] || "eyes-normal");
  if (m === "happy") { mochi.classList.remove("jump"); void mochi.offsetWidth; mochi.classList.add("jump"); }
}
function poke() {
  mochi.classList.remove("shake"); void mochi.offsetWidth; mochi.classList.add("shake");
}
function setLabel(t) { label.innerHTML = t; }

/* eyes follow cursor */
document.addEventListener("mousemove", e => {
  const r = mochi.getBoundingClientRect();
  const dx = Math.max(-6, Math.min(6, (e.clientX - (r.left + r.width/2)) / 24));
  const dy = Math.max(-4, Math.min(4, (e.clientY - (r.top + r.height/2)) / 24));
  $("eyes-track").setAttribute("transform", `translate(${dx} ${dy})`);
});

/* island interactions */
let hoverTimer = null, pokeTimes = [];
island.addEventListener("mouseenter", () => {
  wake();
  hoverTimer = setTimeout(() => {
    for (let i = 0; i < 3; i++) {
      const h = document.createElement("div");
      h.className = "heart"; h.textContent = "💕";
      h.style.left = (30 + Math.random()*40) + "px";
      h.style.top = "8px";
      $("stage").appendChild(h);
      setTimeout(() => h.remove(), 2300);
    }
    api.sound("pop");
  }, 2000);
});
island.addEventListener("mouseleave", () => clearTimeout(hoverTimer));
mochi.addEventListener("click", e => {
  e.stopPropagation();
  const now = Date.now();
  pokeTimes = pokeTimes.filter(t => now - t < 2500);
  pokeTimes.push(now);
  if (pokeTimes.length >= 3) { pokeTimes = []; setMood("dizzy"); api.sound("poke"); }
  else { setMood("annoyed"); poke(); api.sound("poke"); setTimeout(() => { if (mochi.dataset.mood==="annoyed") setMood("idle"); }, 900); }
});
island.addEventListener("click", () => { togglePanel(); });

/* idle -> sleep */
let idleTimer = null;
function armIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (!panel.classList.contains("open")) { setMood("sleeping"); setLabel("💤"); } }, 45000); }
function wake() { armIdle(); if (mochi.dataset.mood === "sleeping") { setMood("idle"); setLabel("Agent KH"); } }

/* ---------- panel ---------- */
function togglePanel() { panel.classList.contains("open") ? closePanel() : openPanel(); }
function openPanel() { panel.classList.add("open"); wake(); api.resize(700, 650); }
function closePanel() { panel.classList.remove("open"); api.resize(240, 90); }
$("close-btn").onclick = closePanel;

/* ---------- event pump: python -> js ---------- */
setInterval(async () => {
  try {
    const items = await api.poll();
    (items || []).forEach(code => { try { (0,eval)(code); } catch(e) { console.error(e); } });
  } catch(e) {}
}, 80);

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".view").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  $("view-" + t.dataset.view).classList.add("active");
});
let muted = false;
$("mute-btn").onclick = () => { muted = !muted; $("mute-btn").textContent = muted ? "🔇" : "🔊"; api.set_muted(muted); };

/* ---------- chat ---------- */
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+?)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
}
function addMsg(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html;
  chatLog.appendChild(d); chatLog.scrollTop = chatLog.scrollHeight;
  return d;
}
function addAct(html) {
  const d = document.createElement("div");
  d.className = "msg act"; d.innerHTML = html;
  actLog.appendChild(d); actLog.scrollTop = actLog.scrollHeight;
}
let typingEl = null;
function typingOn() {
  typingOff();
  typingEl = document.createElement("div");
  typingEl.className = "typing"; typingEl.innerHTML = "<span>●</span><span>●</span><span>●</span>";
  chatLog.appendChild(typingEl); chatLog.scrollTop = chatLog.scrollHeight;
}
function typingOff() { if (typingEl) { typingEl.remove(); typingEl = null; } }

let streamEl = null, streamBuf = "";
function onToken(t) {
  if (!streamEl) { typingOff(); streamEl = addMsg("bot", ""); streamBuf = ""; }
  streamBuf += t;
  streamEl.innerHTML = md(streamBuf);
  chatLog.scrollTop = chatLog.scrollHeight;
}
function onStreamEnd() {
  if (streamEl) { streamEl.innerHTML = md(streamBuf); streamEl = null; streamBuf = ""; }
}
function onSys(t, cls) { addMsg(cls || "sys", esc(t)); }
function onAct(t) { addAct(esc(t)); }

function send() {
  const inp = $("chat-input"), text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  if (text.startsWith("/")) { slash(text); return; }
  addMsg("user", esc(text));
  if (!panel.classList.contains("open")) openPanel();
  switchView("chat");
  typingOn(); setMood("thinking"); setLabel("thinking…");
  api.send_message(text);
}
function slash(text) {
  const cmd = text.split(/\s+/)[0].toLowerCase();
  if (cmd === "/new") { api.clear_history(); chatLog.innerHTML = ""; onSys("new chat started"); }
  else if (cmd === "/model") { api.switch_model(); }
  else if (cmd === "/screenshot") { $("chat-input").value = "Take a screenshot and tell me what you see"; send(); }
  else onSys("unknown command — try /new, /model, /screenshot", "err");
}
function switchView(v) {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.dataset.view === v));
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("active", x.id === "view-" + v));
}
$("send-btn").onclick = send;
$("chat-input").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("model-pill").onclick = () => api.switch_model();

/* ---------- approvals ---------- */
function showApproval(name, args) {
  cards.innerHTML = "";
  const c = document.createElement("div");
  c.className = "card approval";
  c.innerHTML = `<h4>⚠️ Approval needed</h4><p><b>${esc(name)}</b> wants to run:</p><code>${esc(JSON.stringify(args, null, 1))}</code>
    <div class="row">
      <button class="btn green" data-d="allow">Allow</button>
      <button class="btn ghost" data-d="always">Always allow</button>
      <button class="btn red" data-d="deny">Deny</button>
    </div>
    <p style="margin-top:8px;color:#8a8fa3;font-size:12px;">press <b>Y</b> / <b>N</b></p>`;
  cards.appendChild(c);
  c.querySelectorAll("button").forEach(b => b.onclick = () => decide(b.dataset.d));
  if (!panel.classList.contains("open")) openPanel();
  switchView("chat");
  island.classList.add("approval");
  setMood("approval"); setLabel("approval needed 👀");
  api.sound("approval");
}
function decide(d) {
  cards.innerHTML = "";
  island.classList.remove("approval");
  setMood("idle"); setLabel("Agent KH");
  api.decide(d);
}
document.addEventListener("keydown", e => {
  if (cards.querySelector(".card.approval")) {
    if (e.key === "y" || e.key === "Y") decide("allow");
    if (e.key === "n" || e.key === "N") decide("deny");
  }
});

/* ---------- updates ---------- */
function showUpdate(tag) {
  cards.innerHTML = "";
  const c = document.createElement("div");
  c.className = "card update";
  c.innerHTML = `<h4>🎉 New version ${esc(tag)} available!</h4>
    <p>Update right from here — the installer will do the rest.</p>
    <p class="prog" style="color:#e8e8ec;"></p>
    <div class="row">
      <button class="btn green">⬇ Update now</button>
      <button class="btn ghost">Later</button>
    </div>`;
  const [btnGo, btnLater] = c.querySelectorAll("button");
  btnLater.onclick = () => c.remove();
  btnGo.onclick = () => { btnGo.disabled = true; btnLater.disabled = true; api.do_update(); };
  cards.appendChild(c);
  if (!panel.classList.contains("open")) openPanel();
  setMood("happy");
  api.sound("pop");
  c._prog = c.querySelector(".prog");
  c._setProg = t => c._prog.textContent = t;
  cards._updateCard = c;
}
function updateProg(t) { if (cards._updateCard) cards._updateCard._setProg(t); }

/* ---------- settings ---------- */
async function loadSettings() {
  const cfg = await api.get_config() || {};
  $("s-provider").value = cfg.provider || "gemini";
  $("s-key").value = cfg.gemini_key || "";
  $("s-model").value = cfg.gemini_model || "gemini-3.5-flash";
  const cu = cfg.custom || {};
  $("s-custom").value = [cu.url || "", cu.key || "", cu.model || ""].join("\n");
  $("s-auto").checked = !!cfg.auto_approve;
  $("s-lang").value = cfg.lang || "en";
  $("s-soul").value = await api.get_soul() || "";
  $("s-mcp").value = (cfg.mcp_servers || []).map(s => s.name + " | " + s.cmd).join("\n");
  $("ver-text").textContent = "v" + (await api.get_version() || "?");
  $("model-pill").textContent = "⚪ " + (cfg.gemini_model || "…").replace("gemini-", "");
}
$("save-btn").onclick = async () => {
  const lines = $("s-custom").value.split("\n");
  const mcp = $("s-mcp").value.split("\n").map(l => l.trim()).filter(Boolean)
    .map(l => { const [n, c] = l.split("|").map(s => s.trim()); return {name: n, cmd: c}; });
  await api.save_config({
    provider: $("s-provider").value, gemini_key: $("s-key").value,
    gemini_model: $("s-model").value,
    custom: {url: lines[0]||"", key: lines[1]||"", model: lines[2]||""},
    auto_approve: $("s-auto").checked, lang: $("s-lang").value,
    soul: $("s-soul").value, mcp_servers: mcp,
  });
  onSys("settings saved ✓");
};
$("upd-btn").onclick = () => api.check_updates();

/* ---------- boot ---------- */
armIdle();
setMood("idle");
setTimeout(() => { setMood("happy"); api.sound("greeting"); setTimeout(() => setMood("idle"), 1200); }, 700);
loadSettings();
setTimeout(() => api.boot_done(), 400);
</script>
</body>
</html>
