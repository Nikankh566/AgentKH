<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Agent KH</title>
<style>
  :root {
    --bg: #0b0d14; --bg2: #11141f;
    --card: #161a28; --card2: #1d2233; --line: #262c44;
    --acc: #7c6cf5; --acc2: #5a4bd1;
    --txt: #eef0f8; --mut: #8b93b0;
    --ok: #4ade80; --err: #f87171; --warn: #fbbf24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #141828 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--txt);
    font-family: -apple-system, "Segoe UI", Roboto, "Vazirmatn", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    background: rgba(17,20,31,.85); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line); z-index: 5;
  }
  #avatar {
    width: 42px; height: 42px; border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    display: flex; align-items: center; justify-content: center;
    animation: idle 4s ease-in-out infinite;
    box-shadow: 0 4px 18px rgba(124,108,245,.35);
  }
  #avatar svg { width: 26px; height: 26px; }
  #avatar.thinking { animation: think .7s ease-in-out infinite; }
  @keyframes idle { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-3px) rotate(-2deg); } }
  @keyframes think { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  header .t { flex: 1; min-width: 0; }
  header .t b { font-size: 17px; letter-spacing: .2px; }
  header .t span { display: block; font-size: 12px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn {
    background: var(--card2); border: 1px solid var(--line); color: var(--txt);
    width: 42px; height: 42px; border-radius: 13px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, background .15s;
  }
  .iconbtn:active { transform: scale(.92); background: var(--card); }
  .iconbtn svg { width: 20px; height: 20px; }
  /* ---------- chat ---------- */
  #chat { flex: 1; overflow-y: auto; padding: 16px 14px 10px; display: flex; flex-direction: column; gap: 10px; }
  .msg {
    max-width: 86%; padding: 11px 14px; border-radius: 18px;
    font-size: 15px; line-height: 1.55; word-wrap: break-word;
    animation: msgin .25s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes msgin { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--acc), var(--acc2)); border-bottom-right-radius: 6px; box-shadow: 0 3px 12px rgba(124,108,245,.25); }
  .msg.ai { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .msg.sys { align-self: center; background: transparent; color: var(--mut); font-size: 12.5px; text-align: center; max-width: 95%; animation: none; }
  .msg.sys.ok { color: var(--ok); } .msg.sys.err { color: var(--err); }
  .msg.tool { align-self: flex-start; background: rgba(74,222,128,.07); border: 1px solid rgba(74,222,128,.25); font-size: 13px; color: #9be8b8; max-width: 92%; animation: msgin .25s; }
  .msg pre { background: #0a0c12; padding: 10px; border-radius: 10px; overflow-x: auto; font-size: 13px; border: 1px solid var(--line); }
  .msg code { background: #0a0c12; padding: 1px 6px; border-radius: 6px; font-size: 13.5px; }
  .msg a { color: var(--acc); }
  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); animation: tp 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes tp { 0%,100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
  /* ---------- input ---------- */
  #bar {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    background: rgba(17,20,31,.92); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  }
  #inp {
    flex: 1; background: var(--card2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 22px; padding: 12px 17px; font-size: 15px; outline: none; resize: none;
    max-height: 120px; font-family: inherit; transition: border-color .15s;
  }
  #inp:focus { border-color: var(--acc); }
  #send {
    width: 48px; height: 48px; border-radius: 50%; border: none; flex-shrink: 0;
    background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(124,108,245,.4);
    transition: transform .15s, opacity .15s;
  }
  #send:active { transform: scale(.9); }
  #send:disabled { opacity: .45; box-shadow: none; }
  #send svg { width: 20px; height: 20px; }
  /* ---------- settings sheet ---------- */
  #sheet { position: fixed; inset: 0; background: rgba(4,5,10,.7); z-index: 20; display: none; align-items: flex-end; }
  #sheet.open { display: flex; animation: fadein .2s; }
  @keyframes fadein { from { opacity: 0; } }
  #panel {
    width: 100%; background: var(--bg2); border: 1px solid var(--line); border-bottom: none;
    border-radius: 22px 22px 0 0; padding: 14px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 88%; overflow-y: auto; animation: slideup .28s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slideup { from { transform: translateY(60px); opacity: 0; } }
  #grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
  #panel h3 { margin: 0 0 4px; font-size: 18px; }
  #panel .sub { font-size: 12.5px; color: var(--mut); margin-bottom: 6px; }
  #panel label { display: block; font-size: 13px; color: var(--mut); margin: 14px 0 6px; font-weight: 600; }
  #panel input, #panel select {
    width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--txt);
    border-radius: 12px; padding: 12px 14px; font-size: 15px; outline: none; font-family: inherit;
  }
  #panel input:focus, #panel select:focus { border-color: var(--acc); }
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: none; background: transparent; color: var(--mut); padding: 10px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--acc); color: #fff; }
  #keystat { font-size: 12.5px; color: var(--mut); margin-top: 7px; min-height: 17px; }
  #keystat.ok { color: var(--ok); } #keystat.bad { color: var(--err); }
  #testout { font-size: 12.5px; margin-top: 7px; min-height: 17px; color: var(--mut); white-space: pre-wrap; word-break: break-word; }
  #testout.ok { color: var(--ok); } #testout.bad { color: var(--err); }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 14px; border-radius: 14px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform .12s; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #fff; }
  .btn.ghost { background: var(--card2); color: var(--txt); border: 1px solid var(--line); }
  .btn.danger { background: rgba(248,113,113,.1); color: var(--err); border: 1px solid rgba(248,113,113,.3); }
  .btn.small { padding: 10px; font-size: 13.5px; border-radius: 11px; }
  /* ---------- welcome ---------- */
  #welcome { text-align: center; padding: 34px 26px; color: var(--mut); }
  #welcome .orb {
    width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 28px;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    display: flex; align-items: center; justify-content: center;
    animation: idle 4s ease-in-out infinite;
    box-shadow: 0 8px 32px rgba(124,108,245,.4);
  }
  #welcome .orb svg { width: 46px; height: 46px; }
  #welcome b { color: var(--txt); font-size: 19px; display: block; margin-bottom: 8px; }
  #welcome p { font-size: 14px; line-height: 1.7; margin: 0; }
  #welcome .cta { display: inline-block; margin-top: 14px; padding: 11px 22px; border-radius: 12px;
    background: var(--card2); border: 1px solid var(--line); color: var(--txt); font-weight: 700; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div id="avatar">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="4"/><path d="M12 8V4M8 4h8"/><circle cx="9" cy="14" r="1" fill="#fff"/><circle cx="15" cy="14" r="1" fill="#fff"/><path d="M9 17h6"/></svg>
  </div>
  <div class="t"><b>Agent KH</b><span id="status">your pocket agent</span></div>
  <button class="iconbtn" id="btn-settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<div id="chat">
  <div id="welcome">
    <div class="orb">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="4"/><path d="M12 8V4M8 4h8"/><circle cx="9" cy="14" r="1" fill="#fff"/><circle cx="15" cy="14" r="1" fill="#fff"/><path d="M9 17h6"/></svg>
    </div>
    <b>Agent KH</b>
    <p>A personal AI agent in your pocket.<br>Add your API key in Settings to begin.</p>
    <span class="cta" id="welcome-settings">Open Settings</span>
  </div>
</div>

<div id="bar">
  <textarea id="inp" rows="1" placeholder="Message Agent KH…"></textarea>
  <button id="send" aria-label="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
  </button>
</div>

<div id="sheet">
  <div id="panel">
    <div id="grab"></div>
    <h3>Settings</h3>
    <div class="sub">Your key is stored only on this device.</div>

    <label>Provider</label>
    <div class="seg" id="provseg">
      <button data-p="gemini" class="on">Gemini</button>
      <button data-p="openai">OpenAI-compatible</button>
    </div>

    <div id="f-gemini">
      <label>Gemini API key</label>
      <input type="password" id="apikey" placeholder="AIza…" autocomplete="off">
      <div id="keystat"></div>
      <label>Model</label>
      <select id="model">
        <option value="gemini-3.5-flash">gemini-3.5-flash</option>
        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
      </select>
    </div>

    <div id="f-openai" style="display:none">
      <label>Base URL</label>
      <input type="text" id="baseurl" placeholder="https://api.openai.com">
      <label>API key</label>
      <input type="password" id="oapikey" placeholder="sk-…" autocomplete="off">
      <label>Model</label>
      <input type="text" id="oamodel" placeholder="gpt-4o-mini">
    </div>

    <div class="row">
      <button class="btn ghost small" id="btn-test">Test connection</button>
    </div>
    <div id="testout"></div>

    <label>Your name (optional)</label>
    <input type="text" id="username" placeholder="e.g. Nikan">

    <div class="row">
      <button class="btn primary" id="btn-save">Save</button>
      <button class="btn ghost" id="btn-close">Close</button>
    </div>
    <div class="row">
      <button class="btn danger" id="btn-clear">Clear chat history</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
