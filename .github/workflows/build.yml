name: Build Windows release

permissions:
  contents: write   # needed to create GitHub Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            py_arch: x64
            suffix: ""
            setup_exe: "AgentKH-Setup.exe"
            zip_name: "AgentKH-Windows.zip"
            app_title: "Agent KH"
          - arch: x86
            py_arch: x86
            suffix: "-x86"
            setup_exe: "AgentKH-Setup-x86.exe"
            zip_name: "AgentKH-Windows-x86.zip"
            app_title: "Agent KH (32-bit)"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.py_arch }}

      - name: Install PyInstaller
        run: pip install pyinstaller pywebview pillow

      - name: Build executables
        run: pyinstaller AgentKH.spec

      - name: Copy installer files into package
        run: |
          Copy-Item install.ps1 dist/AgentKH/
          Copy-Item installer.nsi dist/AgentKH/

      - name: Build setup wizard (NSIS)
        run: |
          choco install nsis -y
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DOUTFILE=${{ matrix.setup_exe }} /DAPPTITLE="${{ matrix.app_title }}" installer.nsi
          if (!(Test-Path "${{ matrix.setup_exe }}")) { throw "Setup exe was not created" }

      - name: Zip portable package
        run: Compress-Archive -Path dist/AgentKH -DestinationPath ${{ matrix.zip_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentKH-Windows-${{ matrix.arch }}
          path: |
            ${{ matrix.zip_name }}
            ${{ matrix.setup_exe }}

  build-linux:
    # Linux edition: Qt (bundled Chromium) — no system webview needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
            libgl1 libegl1 libdbus-1-3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libasound2t64 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgbm1 libpango-1.0-0 libgtk-3-0

      - name: Install Python dependencies
        run: pip install pyinstaller pyqt6 pyqt6-webengine pillow

      - name: Build executables
        run: pyinstaller AgentKH-Qt.spec

      - name: Package
        run: tar -czf AgentKH-Linux.tar.gz -C dist AgentKH-Qt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentKH-Linux
          path: AgentKH-Linux.tar.gz

  build-macos:
    # macOS edition: pywebview uses native WKWebView — no WebView2 needed.
    # Apple Silicon (arm64); Intel Macs are not covered by this build.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyinstaller pywebview pillow

      - name: Build executables
        run: pyinstaller AgentKH.spec

      - name: Zip package
        run: ditto -c -k --sequesterRsrc --keepParent dist/AgentKH AgentKH-macOS.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentKH-macOS
          path: AgentKH-macOS.zip

  build-android:
    # Android edition: Capacitor wrapper around mobile/www — agentic chat,
    # user provides their own Gemini API key (stored on-device only).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        working-directory: mobile
        run: npm install

      - name: Create Android project
        working-directory: mobile
        run: npx cap add android

      - name: Brand the launcher icon
        run: |
          python3 - <<'EOF'
          from PIL import Image
          import os
          src = Image.open("docs/media/icon.png").convert("RGBA")
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96,
                   "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for d, s in sizes.items():
              p = f"mobile/android/app/src/main/res/{d}"
              os.makedirs(p, exist_ok=True)
              # rounded-square background for adaptive feel
              bg = Image.new("RGBA", (s, s), (26, 26, 46, 255))
              fg = src.resize((int(s * 0.72), int(s * 0.72)), Image.LANCZOS)
              bg.alpha_composite(fg, ((s - fg.width) // 2, (s - fg.height) // 2))
              bg.convert("RGB").save(f"{p}/ic_launcher.png")
              bg.convert("RGB").save(f"{p}/ic_launcher_round.png")
          print("icons done")
          EOF

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon -q

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk AgentKH-Android.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentKH-Android
          path: AgentKH-Android.apk

  release:
    needs: [build, build-qt, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AgentKH-Setup.exe
            artifacts/AgentKH-Windows.zip
            artifacts/AgentKH-Setup-x86.exe
            artifacts/AgentKH-Windows-x86.zip
            artifacts/AgentKH-Qt-Setup.exe
            artifacts/AgentKH-Qt-Windows.zip
            artifacts/AgentKH-Linux.tar.gz
            artifacts/AgentKH-macOS.zip
            artifacts/AgentKH-Android.apk
          body: |
            ## Agent KH — your personal AI desktop agent ✨
            - `AgentKH-Setup.exe` — installer, 64-bit Windows (recommended): installs, adds Start Menu shortcut, auto-starts with Windows
            - `AgentKH-Setup-x86.exe` — installer, 32-bit Windows: for older 32-bit Windows
            - `AgentKH-Windows.zip` — portable 64-bit Windows: extract and run `AgentKH.exe`
            - `AgentKH-Windows-x86.zip` — portable 32-bit Windows
            - `AgentKH-Qt-Setup.exe` — installer, **Qt edition (no WebView2 needed)**: bundles its own Chromium
            - `AgentKH-Qt-Windows.zip` — portable Qt edition
            - `AgentKH-Linux.tar.gz` — Linux (Qt edition): extract and run `AgentKH-Qt/AgentKH-Qt`
            - `AgentKH-macOS.zip` — macOS Apple Silicon: extract and run `AgentKH/AgentKH`
            - `AgentKH-Android.apk` — Android 📱: install on your phone, add your own Gemini API key

  build-qt:
    # Qt edition: PyQt6 + bundled Chromium — works WITHOUT the WebView2 runtime.
    # PyQt6 is 64-bit only, so this job builds x64.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install dependencies
        run: pip install pyinstaller pyqt6 pyqt6-webengine pillow

      - name: Build executables
        run: pyinstaller AgentKH-Qt.spec

      - name: Copy installer files into package
        run: |
          Copy-Item installer-qt.nsi dist/AgentKH-Qt/

      - name: Build setup wizard (NSIS)
        run: |
          choco install nsis -y
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DOUTFILE=AgentKH-Qt-Setup.exe /DAPPTITLE="Agent KH Qt" installer-qt.nsi
          if (!(Test-Path "AgentKH-Qt-Setup.exe")) { throw "Qt setup exe was not created" }

      - name: Zip portable package
        run: Compress-Archive -Path dist/AgentKH-Qt -DestinationPath AgentKH-Qt-Windows.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentKH-Qt-Windows
          path: |
            AgentKH-Qt-Windows.zip
            AgentKH-Qt-Setup.exe
